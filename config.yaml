# Central configuration for the Mobile Network Traffic Forecasting pipeline.
# Edit paths/hyperparameters here rather than in code, so every run is
# reproducible and driven by a single source of truth.
#
# DATA AVAILABILITY NOTE
# -----------------------
# The assignment specifies a ~two-month Milan CDR archive and requires the
# forecasting evaluation to be run on the week of Dec 16-22, 2013. The raw
# archive available in data/raw/ only contains the contiguous block
# 2013-11-01 -> 2013-11-30 (plus two disjoint single-day files, 2013-12-31 and
# 2014-01-01, which are excluded from analysis because they cannot support a
# fair "total traffic over the observation period" comparison or provide
# contiguous history for the training window).
#
# All EDA, ranking, and forecasting below are therefore run over the
# available November window, with the evaluation week substituted to the
# LAST full week of that window (2013-11-24 -> 2013-11-30), which mirrors the
# brief's request for an evaluation week near the end of the observation
# period. If the missing December files (see references [2]/[3] in the
# assignment brief) are added to data/raw/, only `observation_period` and
# `eval_week` below need to change to reproduce the exact Dec 16-22 setup.

seed: 42

data:
  raw_dir: "data/raw"
  raw_glob: "sms-call-internet-mi-*.txt"
  raw_columns: ["square_id", "timestamp_ms", "country_code", "sms_in", "sms_out", "call_in", "call_out", "internet"]
  target_metric: "internet"          # the assignment focuses on Internet traffic
  processed_dir: "data/processed"
  square_totals_path: "data/processed/square_totals.csv"
  target_series_path: "data/processed/target_squares_timeseries.csv"
  target_squares_meta_path: "data/processed/target_squares.yaml"
  datetime_column: "timestamp"
  target_column: "internet"
  frequency: "10min"
  chunksize: 2_000_000

  # Contiguous window used for EDA / total-traffic ranking (see note above).
  observation_period:
    start: "2013-11-01"
    end: "2013-11-30"

  # Two fixed squares required by the assignment brief (Task 2).
  fixed_squares: [4159, 4556]

  # Substitute one-step-ahead forecasting evaluation week (see note above).
  eval_week:
    start: "2013-11-24"
    end: "2013-11-30"
  train_start: "2013-11-01"   # training history preceding the eval week

preprocessing:
  fill_method: "linear"        # method for interpolating missing values
  scaling_method: "minmax"     # minmax | standard | none
  lag_features: [1, 2, 3, 6, 12, 18, 24, 36, 72, 144, 288, 1008]   # in 10-min steps
  rolling_windows: [6, 18, 144]                                    # 1h, 3h, 1 day
  add_time_features: true      # hour-of-day, day-of-week, is_weekend, etc.

models:
  arima:
    order: [2, 1, 2]        # (p, d, q) -- overwritten by tuning results if present
    fourier_period: 144     # 1 day at 10-min resolution
    fourier_harmonics: 2    # daily seasonality modeled via sin/cos regressors (dynamic
                             # harmonic regression), not a full seasonal-ARIMA term --
                             # SARIMAX with seasonal_order s=144 is computationally
                             # impractical to fit/tune at this resolution (see report).

  lstm:
    sequence_length: 144   # 1 day of 10-min history
    units: [64, 32]
    dropout: 0.2
    learning_rate: 0.001
    batch_size: 64
    epochs: 40
    early_stopping_patience: 5

  xgboost:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    early_stopping_rounds: 20

tuning:
  arima:
    order: [[1,1,1], [2,1,2], [3,1,1]]
    fourier_harmonics: [0, 2, 4]   # 0 = no harmonic regressors (plain ARIMA)
  lstm:
    sequence_length: [72, 144]
    units: [[32], [64, 32]]
    learning_rate: [0.001, 0.0005]
  xgboost:
    max_depth: [4, 6, 8]
    n_estimators: [300, 500]
    learning_rate: [0.05, 0.1]

paths:
  experiment_log: "experiments/experiment_log.csv"
  tuning_results: "experiments/hyperparameter_tuning/tuning_results.csv"
  results_dir: "experiments/results"
  plots_dir: "results/plots"
  tables_dir: "results/tables"
